<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Open-Graph-Bild Skills Lab</title>
<link rel="stylesheet" href="../../css/style.css">
<style>
  /* 1200 × 630 px – Vorschaubild beim Teilen in sozialen Netzwerken und Messengern */
  html, body { margin: 0; width: 1200px; height: 630px; background: #ffffff; color: #1b1f23; }
  .og { box-sizing: border-box; height: 630px; padding: 96px 104px; display: flex; flex-direction: column; justify-content: space-between; border-bottom: 12px solid #0e5466; }
  .og img { width: 420px; height: auto; }
  .og p { margin: 0; font-size: 44px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; max-width: 900px; }
  .og small { font-size: 26px; color: #57606a; font-weight: 400; }
</style>
</head>
<body>
<div class="og">
  <img src="../../assets/logo.svg" alt="Skills Lab">
  <p>Kurse und Workshops für alle.<br><small>Gemeinnütziger Verein im Odenwaldkreis · Deutsch · English · Русский</small></p>
</div>
</body>
</html>
