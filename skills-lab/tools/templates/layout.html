<script>
  /* Vor dem ersten Zeichnen: JavaScript-Kennzeichen und gespeicherte Darstellung setzen (verhindert Aufflackern) */
  document.documentElement.classList.add("js");
  try { var t = localStorage.getItem("sl-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
